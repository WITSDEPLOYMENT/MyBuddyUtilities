<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Tippy Schedule Tooltip</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tippy.js -->
  <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css">
  <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/themes/light-border.css">
  <script src="https://unpkg.com/@popperjs/core@2"></script>
  <script src="https://unpkg.com/tippy.js@6"></script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 p-10 space-y-6">

  <div class="grid grid-cols-4 gap-1.5">

    <span class="p-2 rounded-lg text-xs font-medium
                                    bg-blue-50 dark:bg-blue-900/20
                                    text-blue-700 dark:text-blue-300
                                    border border-blue-100 dark:border-blue-800
                                    select-none">
      9:15 AM
    </span>

    <span class="p-2 rounded-lg text-xs font-medium
                                    bg-blue-50 dark:bg-blue-900/20
                                    text-blue-700 dark:text-blue-300
                                    border border-blue-100 dark:border-blue-800
                                    select-none">
      9:21 AM
    </span>

    <span class="p-2 rounded-lg text-xs font-medium
                                    bg-blue-50 dark:bg-blue-900/20
                                    text-blue-700 dark:text-blue-300
                                    border border-blue-100 dark:border-blue-800
                                    select-none">
      11:15 AM
    </span>

    <span class="p-2 rounded-lg text-xs font-medium
                                    bg-blue-50 dark:bg-blue-900/20
                                    text-blue-700 dark:text-blue-300
                                    border border-blue-100 dark:border-blue-800
                                    select-none">
      1:15 PM
    </span>

    <span class="p-2 rounded-lg text-xs font-medium
                                    bg-blue-50 dark:bg-blue-900/20
                                    text-blue-700 dark:text-blue-300
                                    border border-blue-100 dark:border-blue-800
                                    select-none">
      2:15 PM
    </span>

    <span class="p-2 rounded-lg text-xs font-medium
                                    bg-blue-50 dark:bg-blue-900/20
                                    text-blue-700 dark:text-blue-300
                                    border border-blue-100 dark:border-blue-800
                                    select-none">
      3:15 PM
    </span>

    <span class="p-2 rounded-lg text-xs font-medium
                                    bg-blue-50 dark:bg-blue-900/20
                                    text-blue-700 dark:text-blue-300
                                    border border-blue-100 dark:border-blue-800
                                    select-none">
      3:35 PM
    </span>

    <span class="p-2 rounded-lg text-xs font-medium
                                    bg-blue-50 dark:bg-blue-900/20
                                    text-blue-700 dark:text-blue-300
                                    border border-blue-100 dark:border-blue-800
                                    select-none">
      4:15 PM
    </span>

    <span class="p-2 rounded-lg text-xs font-medium
                                    bg-blue-50 dark:bg-blue-900/20
                                    text-blue-700 dark:text-blue-300
                                    border border-blue-100 dark:border-blue-800
                                    select-none">
      5:15 PM
    </span>

    <span class="p-2 rounded-lg text-xs font-medium
                                    bg-blue-50 dark:bg-blue-900/20
                                    text-blue-700 dark:text-blue-300
                                    border border-blue-100 dark:border-blue-800
                                    select-none">
      7:15 PM
    </span>

  </div>

  <!-- ===== Sample Buttons ===== -->

  <button class="all-timers inline-flex items-center p-2 rounded-lg text-xs font-medium
           bg-blue-50 dark:bg-blue-900/20 text-blue-700 dark:text-blue-300
           border border-blue-100 dark:border-blue-800
           hover:bg-blue-200 dark:hover:bg-blue-800/40
           cursor-pointer select-none transition-all active:scale-95"
    data-schedules='["09:15 AM","09:21 AM","11:15 AM","01:15 PM","02:15 PM","03:15 PM","03:35 PM","04:15 PM","05:15 PM","07:15 PM"]'>
    +10 more
  </button>

  <button class="all-timers inline-flex items-center p-2 rounded-lg text-xs font-medium
           bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-300
           border border-green-100 dark:border-green-800
           hover:bg-green-200 dark:hover:bg-green-800/40
           cursor-pointer select-none transition-all active:scale-95"
    data-schedules='["08:00 AM","12:00 PM","06:00 PM"]'>
    View 3 times
  </button>

  <!-- ===== Tooltip Logic ===== -->

  <script>
    // Sample data explanation:
    // data-schedules = array of already formatted time strings
    // This mirrors backend output like:
    // ["09:15 AM", "09:21 AM", "11:15 AM"]

    function renderScheduleTooltip(times) {
      return `
        <div class="bg-white dark:bg-gray-800
                    text-gray-900 dark:text-white
                    rounded-lg p-3 w-60
                    border border-blue-500/30 shadow-xl">
          
          <div class="text-xs uppercase tracking-wider
                      text-blue-500 font-bold mb-2
                      border-b border-gray-200 dark:border-white/10 pb-1">
            Full Schedule
          </div>

          <div class="grid grid-cols-2 gap-1.5">
            ${times.map(t => `
              <span class="inline-flex justify-center p-2 rounded-lg text-xs font-medium
                           bg-blue-50 dark:bg-blue-900/20
                           text-blue-700 dark:text-blue-300
                           border border-blue-100 dark:border-blue-800
                           select-none">
                ${t}
              </span>
            `).join('')}
          </div>
        </div>
      `;
    }

    document.querySelectorAll('.all-timers').forEach(btn => {
      const schedules = JSON.parse(btn.dataset.schedules);

      tippy(btn, {
        content: renderScheduleTooltip(schedules),
        allowHTML: true,
        interactive: true,
        placement: 'right-end',
        theme: 'light-border',
        animation: 'shift-away',
        delay: [100, 0],
        appendTo: document.body
      });
    });
  </script>

</body>

</html>
