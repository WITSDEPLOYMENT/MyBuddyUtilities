<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Tailwind Loader Components</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-10">

  <h1 class="text-3xl font-bold text-center mb-10">
    Tailwind Loader Components
  </h1>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

    <!-- Spinner -->
    <div class="bg-white p-6 rounded-xl shadow flex flex-col items-center gap-4">
      <p class="font-semibold">Spinner</p>
      <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- Dots Loader -->
    <div class="bg-white p-6 rounded-xl shadow flex flex-col items-center gap-4">
      <p class="font-semibold">Dots</p>
      <div class="flex space-x-2">
        <div class="w-3 h-3 bg-indigo-500 rounded-full animate-bounce"></div>
        <div class="w-3 h-3 bg-indigo-500 rounded-full animate-bounce [animation-delay:150ms]"></div>
        <div class="w-3 h-3 bg-indigo-500 rounded-full animate-bounce [animation-delay:300ms]"></div>
      </div>
    </div>

    <!-- Pulse Loader -->
    <div class="bg-white p-6 rounded-xl shadow flex flex-col items-center gap-4">
      <p class="font-semibold">Pulse</p>
      <div class="w-12 h-12 bg-indigo-500 rounded-full animate-pulse"></div>
    </div>

    <!-- Ping Loader -->
    <div class="bg-white p-6 rounded-xl shadow flex flex-col items-center gap-4">
      <p class="font-semibold">Ping</p>
      <div class="relative">
        <span class="absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75 animate-ping"></span>
        <span class="relative inline-flex h-6 w-6 rounded-full bg-indigo-500"></span>
      </div>
    </div>

    <!-- Bars Loader -->
    <div class="bg-white p-6 rounded-xl shadow flex flex-col items-center gap-4">
      <p class="font-semibold">Bars</p>
      <div class="flex items-end space-x-1">
        <div class="w-2 h-6 bg-indigo-500 animate-pulse"></div>
        <div class="w-2 h-8 bg-indigo-500 animate-pulse [animation-delay:150ms]"></div>
        <div class="w-2 h-10 bg-indigo-500 animate-pulse [animation-delay:300ms]"></div>
        <div class="w-2 h-8 bg-indigo-500 animate-pulse [animation-delay:450ms]"></div>
      </div>
    </div>

    <!-- Skeleton Loader -->
    <div class="bg-white p-6 rounded-xl shadow w-full">
      <p class="font-semibold mb-4 text-center">Skeleton</p>
      <div class="space-y-3 animate-pulse">
        <div class="h-4 bg-gray-300 rounded w-3/4"></div>
        <div class="h-4 bg-gray-300 rounded w-full"></div>
        <div class="h-4 bg-gray-300 rounded w-5/6"></div>
      </div>
    </div>

    <!-- Button Loader -->
    <div class="bg-white p-6 rounded-xl shadow flex flex-col items-center gap-4">
      <p class="font-semibold">Button Loader</p>

      <button type="button"
        class="inline-flex cursor-not-allowed items-center rounded-md bg-indigo-500 px-4 py-2 text-sm leading-6 font-semibold text-white transition duration-150 ease-in-out hover:bg-indigo-400"
        disabled=""><svg class="mr-3 -ml-1 size-5 animate-spin text-white" xmlns="http://www.w3.org/2000/svg"
          fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>Processing…</button>

      <button type="button" disabled class="inline-flex items-center px-5 py-2.5 bg-indigo-500 text-white font-semibold rounded-lg
               cursor-not-allowed opacity-75">
        <svg class="mr-3 size-5 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        Processing…
      </button>
    </div>

    <!-- Overlay Loader -->
    <div class="bg-white p-6 rounded-xl shadow flex flex-col items-center gap-4">
      <p class="font-semibold">Overlay Loader</p>
      <div class="relative w-full h-32 bg-gray-200 rounded flex items-center justify-center">
        <div class="absolute w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <div class="absolute">test</div>
      </div>
    </div>

  </div>

</body>

</html>
